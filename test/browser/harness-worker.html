<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rnp-wasm worker harness</title>
</head>
<body>
  <h1>rnp-wasm worker harness</h1>
  <pre id="status">loading…</pre>
  <script type="module">
    // Use a real module worker (not a Blob URL) so import.meta.url is a
    // proper http:// URL and relative imports inside wasm-module.ts
    // (../dist/module.js) resolve correctly.
    async function run() {
      try {
        const result = await new Promise((resolve, reject) => {
          const worker = new Worker("/test/browser/harness-worker.js", { type: "module" });
          const timer = setTimeout(() => {
            worker.terminate();
            reject(new Error("worker init timed out after 30s"));
          }, 30_000);
          worker.onmessage = (ev) => {
            clearTimeout(timer);
            worker.terminate();
            resolve(ev.data);
          };
          worker.onerror = (e) => {
            clearTimeout(timer);
            worker.terminate();
            reject(new Error(e.message || "worker load error"));
          };
        });
        if (result && result.ok) {
          window.__rnpResult = "ok";
          document.getElementById("status").textContent = `ok worker (${result.version})`;
        } else {
          window.__rnpResult = `error: bad payload ${JSON.stringify(result)}`;
          document.getElementById("status").textContent = "error: bad worker payload";
        }
      } catch (e) {
        window.__rnpResult = `error: ${e.message}`;
        document.getElementById("status").textContent = `error: ${e.stack || e.message}`;
      }
    }
    run();
  </script>
</body>
</html>
