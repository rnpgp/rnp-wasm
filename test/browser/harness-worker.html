<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rnp-wasm worker harness</title>
</head>
<body>
  <h1>rnp-wasm worker harness</h1>
  <pre id="status">loading…</pre>
  <script type="module">
    // Inline a minimal worker that loads rnp-wasm itself and verifies it can
    // init + create an FFI + read the version. Worker source is a Blob URL so
    // this harness doesn't depend on a separate worker bundle being emitted.
    const workerSrc = `
      import { initRnp } from "/dist/rnp.js";
      const rnp = await initRnp({ locateWasm: (p) => '/' + p });
      const ffi = rnp.createFfi();
      const v = rnp.versionString();
      ffi.destroy();
      postMessage({ ok: true, version: v });
    `;
    const blob = new Blob([workerSrc], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);

    async function run() {
      try {
        const result = await new Promise((resolve, reject) => {
          const worker = new Worker(url, { type: "module" });
          const timer = setTimeout(() => {
            worker.terminate();
            reject(new Error("worker init timed out after 30s"));
          }, 30_000);
          worker.onmessage = (ev) => {
            clearTimeout(timer);
            worker.terminate();
            resolve(ev.data);
          };
          worker.onerror = (e) => {
            clearTimeout(timer);
            worker.terminate();
            reject(new Error(e.message || "worker load error"));
          };
        });
        if (result && result.ok) {
          window.__rnpResult = "ok";
          document.getElementById("status").textContent = `ok worker (${result.version})`;
        } else {
          window.__rnpResult = `error: bad payload ${JSON.stringify(result)}`;
          document.getElementById("status").textContent = "error: bad worker payload";
        }
      } catch (e) {
        window.__rnpResult = `error: ${e.message}`;
        document.getElementById("status").textContent = `error: ${e.stack || e.message}`;
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    run();
  </script>
</body>
</html>
