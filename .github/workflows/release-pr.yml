name: Release PR

# Automated release-please workflow. Maintains a "Release PR" on main that
# accumulates Conventional Commits and produces a CHANGELOG.md entry. When
# the Release PR is merged, release-please tags the release, which then
# triggers release.yml (the actual publish step).
#
# This workflow does NOT publish to npm or push tags. It only maintains the
# Release PR.

on:
  push:
    branches: [main]

# release-please maintains state in the release PR; concurrent runs could
# race and corrupt it. Queue pushes (don't cancel) so each gets processed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
          package-name: rnp-wasm
          # Bump-only commits won't trigger a release.
          include-component-in-tag: false
          # The pull-request branch pattern; defaults to release-please--branches--main
          bump-minor-pre-major: true
