name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Same PR → same group. Pushing to a PR cancels any in-flight run for that PR.
  # Runs on main (push, not pull_request) group by ref so different branches don't
  # collide, but main itself isn't cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      wasm_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('Dockerfile', 'scripts/**', 'cmake/**', 'src/cpp/**', 'CMakeLists.txt') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rnp-wasm:local
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Run build.sh
        run: docker run --rm --user $(id -u):$(id -g) -v $PWD:/work rnp-wasm:local scripts/build.sh

      - name: Hash wasm artifact
        id: hash
        run: |
          sha=$(sha256sum dist/module.wasm | awk '{print $1}')
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-node:
    name: Test (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["18.18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npm ci
      - run: npm test

  test-browser:
    name: Test (Browser ${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint

  size-budget:
    name: Size budget
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Compute sizes
        id: sizes
        run: |
          cur=$(gzip -c dist/module.wasm | wc -c)
          echo "current=${cur}" >> "$GITHUB_OUTPUT"
          if [[ -f size-budget.json ]]; then
            base=$(jq -r '.["module.wasm.gz"]' size-budget.json)
          else
            base=0
          fi
          echo "baseline=${base}" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const cur = ${{ steps.sizes.outputs.current }};
            const base = ${{ steps.sizes.outputs.baseline }};
            const delta = cur - base;
            const pct = base === 0 ? 0 : Math.round((delta / base) * 100);
            const emoji = delta > 0 ? '⚠️' : '✅';
            const body = `### Bundle size
            ${emoji} module.wasm.gz: **${cur} bytes** (baseline ${base}, delta ${delta >= 0 ? '+' : ''}${delta} / ${pct}%)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Enforce budget
        run: npm run size:budget
