name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One active run per PR (or per ref on main). Pushing a new commit to a PR
  # cancels any in-flight run for that same PR. Pushing to main cancels the
  # previous main run (a fast re-push doesn't need both CIs).
  # PR-number is the primary key; for non-PR events we fall back to the ref.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Single source of truth for Docker build + scripts/build.sh run + dist
  # artifact upload. Lives in .github/workflows/build.yml so release.yml
  # and upstream-tracker.yml can call it too — no copy-pasted build steps.
  build:
    name: Build (Docker)
    uses: ./.github/workflows/build.yml

  test-node:
    name: Test (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npm ci
      - run: npm test

  test-browser:
    name: Test (Browser ${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint

  size-budget:
    name: Size budget
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Compute sizes
        id: sizes
        run: |
          cur=$(gzip -c dist/module.wasm | wc -c)
          echo "current=${cur}" >> "$GITHUB_OUTPUT"
          if [[ -f size-budget.json ]]; then
            base=$(jq -r '.["module.wasm.gz"]' size-budget.json)
          else
            base=0
          fi
          echo "baseline=${base}" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const cur = ${{ steps.sizes.outputs.current }};
            const base = ${{ steps.sizes.outputs.baseline }};
            const delta = cur - base;
            const pct = base === 0 ? 0 : Math.round((delta / base) * 100);
            const emoji = delta > 0 ? '⚠️' : '✅';
            const body = `### Bundle size
            ${emoji} module.wasm.gz: **${cur} bytes** (baseline ${base}, delta ${delta >= 0 ? '+' : ''}${delta} / ${pct}%)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Enforce budget
        run: npm run size:budget
