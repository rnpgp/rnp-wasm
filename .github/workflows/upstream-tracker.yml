name: Upstream tracker

# Weekly probe: rebuild against rnp's main branch to catch API drift early.
# This workflow NEVER pushes to any branch or tag. It opens an issue on failure.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rnp-wasm:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe build against rnp@main
        id: probe
        continue-on-error: true
        run: |
          set -e
          docker run --rm \
            -v "$PWD:/work" \
            -e RNP_REF=origin/main \
            --user $(id -u):$(id -g) \
            rnp-wasm:local \
            scripts/build.sh --rnp-ref origin/main

      - name: Compute drift diff
        if: always()
        id: drift
        run: |
          cd third-party/rnp
          pinned=$(git rev-parse HEAD)
          {
            echo "diff<<EOF"
            git log --oneline "${pinned}..origin/main" | head -50
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.probe.outcome != 'success'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Upstream tracker: rnp@main build failed"
          content-filepath: /tmp/tracker-body.md
          labels: upstream,drift
        env:
          DRIFT: ${{ steps.drift.outputs.diff }}
        # We write the body to /tmp before running the action so env interpolation works.
        run: |
          cat > /tmp/tracker-body.md <<EOF
          The weekly probe against rnp@main failed.

          ## Recent commits on rnp main (since the pinned submodule pointer)

          \`\`\`
          ${DRIFT}
          \`\`\`

          See workflow log for the build error.
          EOF

      - name: Close any prior tracking issue on success
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream,drift',
              state: 'open',
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
