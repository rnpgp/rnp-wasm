name: Upstream tracker

# Weekly probe: rebuild against rnp's main branch to catch API drift early.
# This workflow NEVER pushes to any branch or tag. It opens an issue on failure.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Reuses the same build job as CI but passes rnp_ref=origin/main to probe
  # against rnp's main branch. continue-on-error below catches the failure.
  probe:
    name: Probe build (rnp@main)
    uses: ./.github/workflows/build.yml
    with:
      rnp_ref: origin/main
    permissions:
      contents: read

  report:
    name: Report probe result
    runs-on: ubuntu-24.04
    needs: probe
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Compute drift diff
        id: drift
        run: |
          cd third-party/rnp
          pinned=$(git rev-parse HEAD)
          {
            echo "diff<<EOF"
            git log --oneline "${pinned}..origin/main" | head -50
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render issue body
        if: needs.probe.result != 'success'
        env:
          DRIFT: ${{ steps.drift.outputs.diff }}
        run: |
          cat > /tmp/tracker-body.md <<EOF
          The weekly probe against rnp@main failed.

          ## Recent commits on rnp main (since the pinned submodule pointer)

          \`\`\`
          ${DRIFT}
          \`\`\`

          See workflow log for the build error.
          EOF

      - name: Open or update tracking issue
        if: needs.probe.result != 'success'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Upstream tracker: rnp@main build failed"
          content-filepath: /tmp/tracker-body.md
          labels: upstream,drift

      - name: Close any prior tracking issue on success
        if: needs.probe.result == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream,drift',
              state: 'open',
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
