name: Size budget

on:
  pull_request:

# Cancel any in-flight size-budget run for the same PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Compute sizes
        id: sizes
        run: |
          cur=$(gzip -c dist/rnp.wasm | wc -c)
          echo "current=${cur}" >> "$GITHUB_OUTPUT"
          if [[ -f size-budget.json ]]; then
            base=$(jq -r '.["rnp.wasm.gz"]' size-budget.json)
          else
            base=0
          fi
          echo "baseline=${base}" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const cur = ${{ steps.sizes.outputs.current }};
            const base = ${{ steps.sizes.outputs.baseline }};
            const delta = cur - base;
            const pct = base === 0 ? 0 : Math.round((delta / base) * 100);
            const emoji = delta > 0 ? '⚠️' : '✅';
            const body = `### Bundle size
            ${emoji} rnp.wasm.gz: **${cur} bytes** (baseline ${base}, delta ${delta >= 0 ? '+' : ''}${delta} / ${pct}%)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Enforce budget
        run: npm run size:budget
