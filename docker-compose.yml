services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: rnp-wasm:local
    working_dir: /work
    volumes:
      - .:/work
      - build-cache:/opt/rnp-wasm/build
      - deps-cache:/opt/rnp-wasm/deps
    command: ["scripts/build.sh"]
    user: "1000:1000"

volumes:
  build-cache:
  deps-cache:
